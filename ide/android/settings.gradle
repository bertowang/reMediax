// TGCapture 的 Android Studio 宿主工程（最小骨架）
// 真正的构建逻辑在仓库根目录的 CMakeLists.txt 里，本工程只负责让 Android Studio
// 能以 Native C++ 工程的方式打开它，并通过 externalNativeBuild 驱动 CMake。
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "TGCapture"
include ':app'
